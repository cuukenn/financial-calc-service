# calc-server minimal configuration (Plan 2 Task 1, R79 minimal execution).
server:
  port: 8080
  tomcat:
    # Body-size limits (design §15): Tomcat caps form/multipart posts at max-http-form-post-size
    # and aborts abandoned uploads at max-swallow-size. NOTE: plain JSON request bodies are NOT
    # covered by either setting in Spring Boot 2.7 — a strict JSON body-size filter (1MB) is a
    # deliberate Task 2/3 follow-up if a real consumer needs it (documented limitation, not
    # silently dropped).
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB

spring:
  application:
    name: calc-server
  web:
    resources:
      # Route "no handler found" through the unified error advice (R77/FCS-SRV-1005) instead of
      # Boot's default /error body. add-mappings: false stops the resource handler from consuming
      # unmatched paths; since Boot 3.2 the DispatcherServlet always throws NoHandlerFoundException
      # for them (A6 note: the old spring.mvc.throw-exception-if-no-handler-found property was
      # removed with Boot 3 — its true behavior is now the default), landing in ApiExceptionHandler.
      add-mappings: false

logging:
  level:
    # 默认 INFO（run 生命周期 / WARN 诊断 / 启动装配）；排查引擎逐步耗时与装配细节时开 DEBUG
    io.github.cuukenn.fincalc: INFO
