# 一键部署：docker compose up -d --build
# 单容器：前端界面与后端 API 打在同一个 jar 里，一个端口全部搞定
#   工作台入口 → http://localhost:8080/（jar 内静态资源）
#   API        → http://localhost:8080/api/v1/...
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: financial-calc-app:latest
    container_name: financial-calc-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
