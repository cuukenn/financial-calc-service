name: Release

# 打 tag 触发：git push origin v* → 构建前后端产物 → 创建 GitHub Release 并附产物
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-backend:
    name: 后端产物（Spring Boot jar）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 测试后打包（N-01 闸门测试一并执行）
        run: mvn -B package

      - name: 上传后端产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: calc-server/target/calc-server-*.jar

  build-frontend:
    name: 前端产物（Vue dist 包）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 测试 + 构建
        run: |
          npm run build
          npm test

      - name: 打包前端产物
        run: |
          cd dist
          zip -r ../financial-calc-web-${{ github.ref_name }}.zip .
          cd ..
          mv financial-calc-web-${{ github.ref_name }}.zip /tmp/

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: /tmp/financial-calc-web-${{ github.ref_name }}.zip

  release:
    name: 创建 GitHub Release
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载后端产物
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: artifacts/

      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/

      - name: 附上 docker-compose 与 Dockerfile 供部署
        run: |
          cp docker-compose.yml artifacts/
          zip -j artifacts/docker-deploy-${{ github.ref_name }}.zip docker-compose.yml docker/backend.Dockerfile docker/frontend.Dockerfile docker/nginx.conf

      - name: 创建 Release 并附产物
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/calc-server-*.jar
            artifacts/financial-calc-web-*.zip
            artifacts/docker-compose.yml
            artifacts/docker-deploy-*.zip
