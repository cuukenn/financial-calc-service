# Release：打 tag（v*）→ 前端构建产物打进 jar 静态资源 → 一个 jar 产物 + 部署文件
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: 一体化产物（前端 dist 进 jar 静态资源）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 前端构建（类型检查 + 测试 + 产物）
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test

      - name: 前端产物进 jar 静态资源
        run: |
          mkdir -p calc-server/src/main/resources/static
          cp -r web/dist/* calc-server/src/main/resources/static/

      # N-01：闸门测试在 mvn package 全量执行
      - name: 后端测试后打包（jar 自带前端界面）
        run: mvn -B package

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: financial-calc-app
          path: calc-server/target/calc-server-*.jar

  release:
    name: 创建 GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: financial-calc-app
          path: artifacts/

      - name: 附上部署文件（根目录 Dockerfile + compose）
        run: |
          zip -j artifacts/docker-deploy-${{ github.ref_name }}.zip docker-compose.yml Dockerfile .dockerignore

      - name: 创建 Release 并附产物
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/calc-server-*.jar
            artifacts/docker-compose.yml
            artifacts/docker-deploy-*.zip
