name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: 后端测试（JDK 17 / Maven）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # N-01：闸门测试（RunCostBaselineTest 等）在 mvn test 全量执行
      - name: Maven 测试
        run: mvn -B test

  frontend:
    name: 前端测试（vitest / vue-tsc）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 构建产物
        run: npm run build

      - name: 单元测试
        run: npm test
